body { margin: 0; }
html[data-lang="ru"] [lang="uk"] { display: none; }
html[data-lang="uk"] [lang="ru"] { display: none; }
html:not([data-lang]) [lang="uk"] { display: none; }
#notfound {
  --bg-primary: #FDF9F4;
  --accent-main: #C4845A;
  --accent-mid: #8B6E5C;
  --text-muted: #7A6255;
  --text-on-cta: #FFFFFF;
  box-sizing: border-box;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  background: var(--bg-primary);
  text-align: center;
}
#notfound * { box-sizing: border-box; }
.nf-code {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 12px;
  color: var(--accent-main);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin: 0 0 16px;
}
.nf-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  font-size: 44px;
  line-height: 1.2;
  color: var(--accent-mid);
  margin: 0 0 32px;
}
.nf-btn {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 0.02em;
  padding: 14px 36px;
  border-radius: 12px;
  text-decoration: none;
  display: inline-block;
  background: var(--accent-main);
  color: var(--text-on-cta);
  border: 1px solid var(--accent-main);
  transition: opacity 0.3s ease;
}
.nf-btn:hover { opacity: 0.88; }
.nf-lang { margin-top: 40px; font-family: 'Inter', sans-serif; font-weight: 300; font-size: 13px; color: var(--text-muted); }
.nf-lang button { font: inherit; color: inherit; background: none; border: 0; padding: 4px 6px; cursor: pointer; }
.nf-lang button.is-active { color: var(--accent-main); }
@media (max-width: 768px) { .nf-title { font-size: 32px; } }
</style>
</head>
<body>
<section id="notfound">
  <div>
    <p class="nf-code">404</p>
    <h1 class="nf-title"><span lang="ru">Страница не найдена</span><span lang="uk">Сторінку не знайдено</span></h1>
    <a class="nf-btn" href="/"><span lang="ru">На главную</span><span lang="uk">На головну</span></a>
    <div class="nf-lang lang-switch" role="group" aria-label="Язык сайта / Мова сайту">
      <button type="button" data-set-lang="ru" aria-label="Русский">RU</button><span aria-hidden="true">|</span><button type="button" data-set-lang="uk" aria-label="Українська">UA</button>
    </div>
  </div>
</section>
<script>
(function () {
  function applyLang(lang) {
    document.documentElement.setAttribute('data-lang', lang);
    document.querySelectorAll('.lang-switch [data-set-lang]').forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-set-lang') === lang);
    });
    document.dispatchEvent(new CustomEvent('site:langchange', { detail: { lang: lang } }));
  }
  var saved = localStorage.getItem('site_lang') || 'ru';
  applyLang(saved);
  document.querySelectorAll('.lang-switch [data-set-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      var lang = b.getAttribute('data-set-lang');
      localStorage.setItem('site_lang', lang);
      applyLang(lang);
    });
  });
})();
</script>
</body>
</html>
